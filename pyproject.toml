[project]
name = "trading-bot"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
exclude = ["graphify-out"]

[tool.ruff.lint]
# Keep the CI gate focused on correctness-critical syntax, undefined names,
# and import errors. Broader style migration can happen independently without
# blocking a safety release of an existing codebase.
select = ["E4", "E7", "E9", "F"]
