services:
  postgres:
    # Official postgres:16-alpine multi-architecture manifest, pinned after
    # verification. Update deliberately as part of a reviewed release.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-trading_bot}
      POSTGRES_USER: ${POSTGRES_USER:-tradingbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Compose environment}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    cpus: "1.00"
    mem_limit: 768M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  bot:
    build: .
    env_file:
      - ${BOT_ENV_FILE:-.env.bot}
    environment:
      # Containers log to stdout; a file target conflicts with read_only.
      LOG_FILE: ""
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    cpus: "1.00"
    mem_limit: 768M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from datetime import datetime, timezone; from config import Config; from state import StateStore; config = Config.from_env(); state = StateStore(config, initialize_schema=False); heartbeat = state.get_meta('bot_heartbeat', ''); state.close(); timestamp = datetime.fromisoformat(heartbeat); timestamp = timestamp if timestamp.tzinfo else timestamp.replace(tzinfo=timezone.utc); max_age = max(180, config.loop_seconds * 3); raise SystemExit(0 if (datetime.now(timezone.utc) - timestamp).total_seconds() < max_age else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  dashboard:
    build: .
    env_file:
      - ${DASHBOARD_ENV_FILE:-.env.dashboard}
    environment:
      LOG_FILE: ""
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8080",
        "--workers",
        "2",
        "--threads",
        "4",
        "--worker-tmp-dir",
        "/dev/shm",
        "--timeout",
        "30",
        "--graceful-timeout",
        "30",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-",
        "dashboard.app:create_app()",
      ]
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    cpus: "0.50"
    mem_limit: 512M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8080/healthz', timeout=5); raise SystemExit(0 if response.status == 200 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
