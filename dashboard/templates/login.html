<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — Trading Bot Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0b1220; color: #e5e7eb; }
    .box { background: #111a2e; border: 1px solid #1f2a44; border-radius: 12px; padding: 32px; width: 340px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { color: #94a3b8; font-size: 13px; margin: 0 0 20px; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    input { width: 100%; padding: 10px 12px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #334155; background: #0b1220; color: #e5e7eb; font-size: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: #2563eb; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .error { color: #f87171; font-size: 13px; margin-bottom: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Trading Bot Dashboard</h1>
    <p class="sub">Sign in to view bot status, positions and trades.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
